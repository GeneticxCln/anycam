name: Release

# Pushing a version tag (v1.0.0, v1.1.0, ...) builds the source tarball and the
# wheel, checks that the bundled emoji, models and styles made it in, installs the
# wheel into a clean environment as a smoke test, and publishes a GitHub Release
# with SHA256SUMS.  Run it by hand from the Actions tab to build the files
# without publishing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag must match the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python - <<'PY'
          import tomllib
          print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
          PY
          )
          tag="${GITHUB_REF_NAME#v}"
          echo "pyproject version: $version, tag: $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi

      - name: Build the source tarball and the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir dist

      - name: The packages contain the bundled assets
        run: |
          ls -l dist
          tarball=$(ls dist/*.tar.gz)
          wheel=$(ls dist/*.whl)
          for pattern in "assets/emoji/1f384.png" "assets/emoji/SHA256.json" \
                         "assets/models/selfie_segmentation_landscape.onnx" \
                         "assets/models/yunet.onnx" "assets/sample-portrait.jpg" \
                         "anycam/frames.py" "anycam/masks.py" "anycam/particles.py" \
                         "anycam/phone/static/index.html" "anycam/phone/static/phone.js"; do
            tar -tzf "$tarball" | grep -q "$pattern" || { echo "::error::$pattern missing from the tarball"; exit 1; }
            unzip -l "$wheel" | grep -q "$pattern" || { echo "::error::$pattern missing from the wheel"; exit 1; }
          done
          echo "tarball and wheel contain the bundled assets"

      - name: Smoke test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python - <<'PY'
          import anycam
          from anycam import about, emoji, frames, masks, particles
          assert anycam.__version__, "no version"
          assert len(emoji.available()) >= 150, "emoji pack incomplete"
          assert len(frames.THEMES) >= 30 and len(masks.MASKS) >= 20 and len(particles.PRESETS) >= 35
          print("anycam", anycam.__version__, "-", about.release_line())
          PY

      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: anycam-dist
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: anycam-dist
          path: dist

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > notes.md <<NOTES
          Linux-native virtual camera studio: cameras, screens, video, overlays, face masks,
          themed frames and animations composed into one picture for Discord, Chrome, OBS and
          recordings.

          **Install**

          \`\`\`
          pip install anycam-${version}.tar.gz   # or the .whl
          \`\`\`

          PyGObject and the GStreamer plugins come from your distribution (see the README's
          Requirements). Verify the download with \`sha256sum -c SHA256SUMS\`.

          NOTES
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file notes.md --generate-notes --verify-tag
          fi
