name: Release

# Pushing a version tag (v1.0.0, v1.1.0, ...) builds the source tarball and the
# wheel, checks that the bundled emoji, models and styles made it in, installs the
# wheel into a clean environment as a smoke test, and publishes a GitHub Release
# with SHA256SUMS.  It also builds the .deb and the Arch package and attaches
# them.  Run it by hand from the Actions tab to build the files without
# publishing, or give it an existing tag to build that tag's packages and
# attach them to its release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag (v1.5.0) to build and publish; empty builds without publishing"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify version metadata consistency
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          import tomllib
          import xml.etree.ElementTree as ET
          from pathlib import Path

          pyproject = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          config_text = Path("src/anycam/config.py").read_text(encoding="utf-8")
          m_cfg = re.search(r'^VERSION\s*=\s*"([^"]+)"', config_text, re.M)
          config_ver = m_cfg.group(1) if m_cfg else ""
          pkgbuild_text = Path("packaging/arch/PKGBUILD").read_text(encoding="utf-8")
          m_pkg = re.search(r'^pkgver=([^\s]+)', pkgbuild_text, re.M)
          pkgbuild_ver = m_pkg.group(1) if m_pkg else ""
          meta_root = ET.parse("packaging/metainfo/io.github.geneticxcln.AnyCam.metainfo.xml").getroot()
          meta_versions = [rel.get("version") for rel in meta_root.iter("release")]

          print(f"pyproject={pyproject} config={config_ver} pkgbuild={pkgbuild_ver} metainfo={meta_versions}")
          errors = []
          if config_ver != pyproject:
              errors.append(f"src/anycam/config.py VERSION={config_ver!r} != {pyproject!r}")
          if pkgbuild_ver != pyproject:
              errors.append(f"packaging/arch/PKGBUILD pkgver={pkgbuild_ver!r} != {pyproject!r}")
          if not meta_versions or meta_versions[0] != pyproject:
              errors.append(f"metainfo latest release={meta_versions[:1]!r} != {pyproject!r}")
          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/v"):
              tag = ref.removeprefix("refs/tags/v")
              if tag != pyproject:
                  errors.append(f"tag v{tag} != pyproject.toml version {pyproject}")
          if errors:
              for err in errors:
                  print(f"::error::{err}")
              sys.exit(1)
          PY

      - name: Compile and lint
        run: |
          python -m pip install --upgrade pip build ruff
          python -m compileall -q src tests scripts
          python -m ruff check src tests scripts

      - name: Build the source tarball and the wheel
        run: |
          python -m build --sdist --wheel --outdir dist

      - name: The packages contain the bundled assets
        run: |
          ls -l dist
          tarball=$(ls dist/*.tar.gz)
          wheel=$(ls dist/*.whl)
          for pattern in "assets/emoji/1f384.png" "assets/emoji/SHA256.json" \
                         "assets/models/selfie_segmentation_landscape.onnx" \
                         "assets/models/yunet.onnx" "assets/sample-portrait.jpg" \
                         "anycam/assets/anycam-logo.png" \
                         "anycam/assets/i18n/de.json" \
                         "anycam/frames.py" "anycam/masks.py" "anycam/particles.py" \
                         "anycam/phone/static/index.html" "anycam/phone/static/phone.js" \
                         "anycam/phone/static/remote.html" "anycam/phone/static/remote.js"; do
            tar -tzf "$tarball" | grep -q "$pattern" || { echo "::error::$pattern missing from the tarball"; exit 1; }
            unzip -l "$wheel" | grep -q "$pattern" || { echo "::error::$pattern missing from the wheel"; exit 1; }
          done
          echo "tarball and wheel contain the bundled assets"

      - name: Smoke test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/smoke/bin/anycam --version
          /tmp/smoke/bin/python - <<'PY'
          import anycam
          from anycam import about, emoji, frames, i18n, masks, particles
          from anycam.phone import server as phone_server
          assert anycam.__version__, "no version"
          assert len(emoji.available()) >= 150, "emoji pack incomplete"
          assert len(frames.THEMES) >= 30 and len(masks.MASKS) >= 20 and len(particles.PRESETS) >= 35
          assert "de" in i18n.available_languages(), "de translation catalog missing"
          assert i18n.load("de").get("AI effects") == "KI-Effekte", "de translation lookup failed"
          for name in ("index.html", "phone.js", "remote.html", "remote.js"):
              assert phone_server._static(name), f"missing phone static asset {name}"
          print("anycam", anycam.__version__, "-", about.release_line())
          PY

      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: anycam-dist
          path: dist/*
          if-no-files-found: error

  deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build the .deb
        run: packaging/deb/build.sh deb-out

      - name: Inspect it
        run: |
          ls -l deb-out
          dpkg-deb --info deb-out/*.deb
          dpkg-deb --contents deb-out/*.deb | grep -E 'usr/bin/anycam|dist-packages/anycam/credentials.py'

      - uses: actions/upload-artifact@v4
        with:
          name: anycam-deb
          path: deb-out/*.deb
          if-no-files-found: error

  arch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm base-devel git sudo

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: makepkg
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          mkdir /tmp/pkg
          git archive --format=tar.gz --prefix="anycam-$version/" HEAD -o "/tmp/pkg/anycam-$version.tar.gz"
          cp packaging/arch/PKGBUILD /tmp/pkg/PKGBUILD
          sed -i 's|^source=.*|source=("anycam-$pkgver.tar.gz")|' /tmp/pkg/PKGBUILD
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder /tmp/pkg
          su builder -c 'cd /tmp/pkg && makepkg -s --noconfirm'

      - name: The package installs and starts
        run: |
          pacman -U --noconfirm /tmp/pkg/*.pkg.tar.zst
          QT_QPA_PLATFORM=offscreen anycam --help

      - uses: actions/upload-artifact@v4
        with:
          name: anycam-arch
          path: /tmp/pkg/*.pkg.tar.zst
          if-no-files-found: error

  release:
    needs: [build, deb, arch]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: anycam-*
          merge-multiple: true
          path: dist

      - name: Checksums of everything that is attached
        working-directory: dist
        run: |
          rm -f SHA256SUMS
          sha256sum anycam* | tee SHA256SUMS

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          GITHUB_REF_NAME="$TAG"
          version="${GITHUB_REF_NAME#v}"
          cat > notes.md <<NOTES
          Linux-native virtual camera studio: cameras, screens, video, overlays, face masks,
          themed frames and animations composed into one picture for Discord, Chrome, OBS and
          recordings.

          **Install**

          \`\`\`
          pip install anycam-${version}.tar.gz   # or the .whl
          \`\`\`

          PyGObject and the GStreamer plugins come from your distribution (see the README's
          Requirements). Debian and Ubuntu: \`sudo apt install ./anycam_${version}_all.deb\`.
          Arch: \`sudo pacman -U anycam-${version}-1-any.pkg.tar.zst\`. Verify the downloads
          with \`sha256sum -c SHA256SUMS\`.

          NOTES
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file notes.md --generate-notes --verify-tag
          fi
