name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip python3-gi python3-gi-cairo \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            ffmpeg libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-xinerama0

      - name: Install Python dependencies
        run: |
          /usr/bin/python3 -m pip install --break-system-packages --upgrade pip
          /usr/bin/python3 -m pip install --break-system-packages \
            "PySide6-Essentials>=6.6" numpy Pillow psutil pytest pytest-timeout \
            onnxruntime

      - name: Compile sources
        run: /usr/bin/python3 -m compileall -q src tests

      - name: Run tests
        run: /usr/bin/python3 -m pytest tests
