name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
      # Stream pytest's output instead of flushing it once at the end: a test
      # that blocks must name itself in the log, not leave the step empty
      # until the job timeout kills it.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip python3-gi python3-gi-cairo \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gir1.2-gdkpixbuf-2.0 gir1.2-secret-1 \
            v4l-utils gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-x gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-pipewire \
            gir1.2-gst-plugins-bad-1.0 gstreamer1.0-nice openssl qrencode \
            ffmpeg libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-xinerama0

      # textoverlay (the Pango plugin) ships in gstreamer1.0-x and pipewiresrc
      # in gstreamer1.0-pipewire on Ubuntu, not in plugins-base/bad.  Without
      # them the standby chain and every screen chain raise "GStreamer element
      # '...' is not installed" instead of skipping.
      - name: The GStreamer elements the suite needs are installed
        run: |
          /usr/bin/gst-inspect-1.0 textoverlay
          /usr/bin/gst-inspect-1.0 pipewiresrc

      - name: Install Python dependencies
        run: |
          /usr/bin/python3 -m pip install --break-system-packages --upgrade pip
          /usr/bin/python3 -m pip install --break-system-packages \
            "PySide6-Essentials>=6.6" numpy Pillow psutil pytest pytest-timeout \
            pytest-cov onnxruntime cryptography
          /usr/bin/python3 -m pip install --break-system-packages ruff

      - name: Compile sources
        run: /usr/bin/python3 -m compileall -q src tests

      # Real defects only (undefined names, unused imports, late-binding
      # closures, mutable defaults, comparisons to singletons): style is not
      # enforced.  The rule set is in pyproject.toml.
      - name: Lint
        run: /usr/bin/python3 -m ruff check src

      - name: Run tests
        # addopts in pyproject.toml is "-q", which cancels out -v and would
        # hide the name of the test that is running.  --timeout turns a stuck
        # GStreamer call into one failed test with its stack dump, instead of
        # a job that sits silent until timeout-minutes kills it.
        run: |
          /usr/bin/python3 -m pytest tests \
            -o addopts="" -v \
            --timeout=180 --timeout-method=thread \
            --cov=anycam --cov-report=term:skip-covered --cov-report=xml \
            --junitxml=report.xml

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report.xml
          if-no-files-found: warn

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  # The same suite with the hardware masking switch on.  A developer runs
  # `pytest tests --no-hardware` on a machine that does have cameras, a
  # loopback node and audio; this job is the reference that run is compared
  # against (same tests, same skips).  If the two ever disagree, the switch is
  # not describing the device layer faithfully.
  test-no-hardware:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip python3-gi python3-gi-cairo \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gir1.2-gdkpixbuf-2.0 gir1.2-secret-1 \
            v4l-utils gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-x gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-pipewire \
            gir1.2-gst-plugins-bad-1.0 gstreamer1.0-nice openssl qrencode \
            ffmpeg libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-xinerama0

      # textoverlay (the Pango plugin) ships in gstreamer1.0-x and pipewiresrc
      # in gstreamer1.0-pipewire on Ubuntu, not in plugins-base/bad.  Without
      # them the standby chain and every screen chain raise "GStreamer element
      # '...' is not installed" instead of skipping.
      - name: The GStreamer elements the suite needs are installed
        run: |
          /usr/bin/gst-inspect-1.0 textoverlay
          /usr/bin/gst-inspect-1.0 pipewiresrc

      - name: Install Python dependencies
        run: |
          /usr/bin/python3 -m pip install --break-system-packages --upgrade pip
          /usr/bin/python3 -m pip install --break-system-packages \
            "PySide6-Essentials>=6.6" numpy Pillow psutil pytest pytest-timeout \
            onnxruntime

      - name: Compile sources
        run: /usr/bin/python3 -m compileall -q src tests

      - name: Run tests with hardware masked
        # -rs keeps the skip reasons in the log: that list is what a developer
        # compares against their own --no-hardware run.
        run: |
          /usr/bin/python3 -m pytest tests \
            -o addopts="" -v -rs --no-hardware \
            --timeout=180 --timeout-method=thread \
            --junitxml=report.xml

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-no-hardware
          path: report.xml
          if-no-files-found: warn

  # The keyring wrapper against a real Secret Service: gnome-keyring inside a
  # throwaway D-Bus session, unlocked with a throwaway password.  The other
  # jobs run the same tests against the in-memory keyring and skip the real
  # one.  Not yet seen green on GitHub: remove continue-on-error once it is.
  test-keyring:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip python3-gi gir1.2-secret-1 gnome-keyring dbus-user-session

      - name: Install Python dependencies
        run: /usr/bin/python3 -m pip install --break-system-packages pytest

      - name: The credentials tests against a real keyring
        run: |
          dbus-run-session -- bash -c '
            echo -n "ci-throwaway" | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            ANYCAM_TEST_KEYRING=1 /usr/bin/python3 -m pytest tests/test_credentials.py -o addopts="" -v
          '

  # The Arch recipe built from this checkout (not the release tarball it
  # names), then installed.  Built once by hand with makepkg on 2026-11-14; not
  # yet seen green on GitHub: remove continue-on-error once it is.
  pkgbuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm base-devel git sudo

      - uses: actions/checkout@v4

      - name: makepkg
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          mkdir /tmp/pkg
          git archive --format=tar.gz --prefix="anycam-$version/" HEAD -o "/tmp/pkg/anycam-$version.tar.gz"
          cp packaging/arch/PKGBUILD /tmp/pkg/PKGBUILD
          sed -i 's|^source=.*|source=("anycam-$pkgver.tar.gz")|' /tmp/pkg/PKGBUILD
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder /tmp/pkg
          su builder -c 'cd /tmp/pkg && makepkg -s --noconfirm'

      - name: The package installs and starts
        run: |
          pacman -U --noconfirm /tmp/pkg/*.pkg.tar.zst
          QT_QPA_PLATFORM=offscreen anycam --help

