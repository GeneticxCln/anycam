[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anycam"
version = "1.4.0"
description = "AnyCam - Linux-native virtual camera studio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AnyCam" }]
dependencies = [
  "numpy>=1.26",
  "Pillow>=10",
  "psutil>=5.9",
]

# PyGObject (``gi``) and the GStreamer plugins are required too, but they come
# from the distribution (python-gobject, gst-plugins-*), not from PyPI, so they
# cannot be declared here.  See the README's Requirements section.
[project.optional-dependencies]
# The window.  Without it only the CLI/headless demo works.
gui = ["PySide6>=6.6"]
dev = ["pytest>=8", "pytest-timeout>=2"]
# Powers the bundled YuNet face overlay; install with `pip install -e '.[face]'`.
face = ["onnxruntime>=1.16"]
# PyGObject builds against the system's GLib/GStreamer headers, so most users
# take python-gobject from their distribution instead; this extra is for a
# virtual environment that has those development packages.
gi = ["PyGObject>=3.42"]
# Phone camera: in-process TLS certificate and QR code (otherwise the openssl
# and qrencode commands are used).
phone = ["cryptography>=42", "segno>=1.6"]

[project.scripts]
anycam = "anycam.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.package-data]
anycam = ["phone/static/*.html", "phone/static/*.js", "assets/*.png", "assets/*.jpg", "assets/models/*.onnx", "assets/models/*.md", "assets/emoji/*.png", "assets/emoji/*.json", "assets/emoji/*.md", "assets/i18n/*.json"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Defects, not style: undefined/unused names, late-binding closures, mutable
# defaults, singleton comparisons, invalid escapes and similar.
select = ["F", "E9", "B006", "B008", "B012", "B015", "B018", "B023",
          "E711", "E712", "E713", "E714", "PLE"]
